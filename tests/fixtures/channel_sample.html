<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<div class="tgme_page_photo">
  <i class="tgme_page_photo_image"><img src="https://cdn.example/photo.jpg"></i>
</div>
<div class="tgme_channel_info">
  <div class="tgme_channel_info_header">
    <div class="tgme_channel_info_header_title"><span>Sample Channel</span></div>
  </div>
  <div class="tgme_channel_info_description">A channel about tech and AI news.</div>
  <div class="tgme_channel_info_counters">
    <div class="tgme_channel_info_counter">
      <span class="counter_value">1.2M</span><span class="counter_type">subscribers</span>
    </div>
    <div class="tgme_channel_info_counter">
      <span class="counter_value">3.4K</span><span class="counter_type">photos</span>
    </div>
  </div>
</div>

<section class="tgme_channel_history">
  <div class="tgme_widget_message_wrap">
    <div class="tgme_widget_message" data-post="sample/101">
      <div class="tgme_widget_message_text">First post about a new AI model release.</div>
      <div class="tgme_widget_message_footer">
        <time datetime="2026-09-10T08:00:00+00:00">Sep 10</time>
        <span class="tgme_widget_message_views">12.5K</span>
      </div>
      <div class="tgme_widget_message_reactions">
        <span class="tgme_widget_message_reaction">👍 340</span>
        <span class="tgme_widget_message_reaction">🔥 60</span>
      </div>
    </div>
  </div>

  <div class="tgme_widget_message_wrap">
    <div class="tgme_widget_message" data-post="sample/102">
      <a class="tgme_widget_message_photo_wrap" style="background-image:url(x)"></a>
      <div class="tgme_widget_message_text">Second post with a photo and a market update.</div>
      <div class="tgme_widget_message_footer">
        <time datetime="2026-09-11T09:30:00+00:00">Sep 11</time>
        <span class="tgme_widget_message_views">3 200</span>
      </div>
    </div>
  </div>

  <div class="tgme_widget_message_wrap">
    <div class="tgme_widget_message" data-post="sample/103">
      <div class="tgme_widget_message_text">Third post, short note.</div>
      <div class="tgme_widget_message_footer">
        <time datetime="2026-09-12T10:00:00+00:00">Sep 12</time>
        <span class="tgme_widget_message_views">890</span>
      </div>
    </div>
  </div>
</section>
</body></html>
